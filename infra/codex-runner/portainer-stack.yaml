services:
  repo-init:
    image: mengtuv-codex-runner:${CODEX_VERSION:-0.145.0}
    build:
      # The Compose file is under infra/codex-runner; move back to the Git root.
      context: ../..
      dockerfile: infra/codex-runner/Dockerfile
      args:
        CODEX_VERSION: ${CODEX_VERSION:-0.145.0}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
        HTTP_PROXY: ${HTTP_PROXY:-http://192.168.1.43:7890}
        HTTPS_PROXY: ${HTTPS_PROXY:-http://192.168.1.43:7890}
    command: ["init-workspace"]
    restart: "no"
    init: true
    env_file:
      - ./新建 文本文档.env
    environment:
      ENABLE_SSHD: "false"
    volumes:
      - workspace:/workspace
      - ${GIT_SSH_PATH:-/opt/mengtu-codex/ssh}:/home/codex/.ssh:ro

  codex:
    image: mengtuv-codex-runner:${CODEX_VERSION:-0.145.0}
    restart: unless-stopped
    init: true
    depends_on:
      repo-init:
        condition: service_completed_successfully
    working_dir: /workspace
    ports:
      - "2222:22"
    env_file:
      - ./新建 文本文档.env
    volumes:
      - workspace:/workspace
      - codex-home:/home/codex/.codex
      - nuget-cache:/home/codex/.nuget/packages
      - codex-runs:/runs
      - ${GIT_SSH_PATH:-/opt/mengtu-codex/ssh}:/home/codex/.ssh:ro
      - ssh-hostkeys:/var/lib/codex/ssh-hostkeys
    healthcheck:
      test: ["CMD-SHELL", "test -d /workspace/.git && codex --version >/dev/null && dotnet --version >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  workspace:
  codex-home:
  nuget-cache:
  codex-runs:
  ssh-hostkeys:

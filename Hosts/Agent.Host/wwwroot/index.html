<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MAF 管理台</title>
  <link rel="stylesheet" href="app.css?v=20260827.7">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="业务与会话导航">
      <header class="brand-bar">
        <div class="brand-mark" aria-hidden="true">M</div>
        <div>
          <strong>MAF Console</strong>
          <span>Agent 管理台</span>
        </div>
        <button class="icon-button mobile-only" id="closeSidebarButton" type="button" title="关闭会话列表" aria-label="关闭会话列表">
          <i data-lucide="x"></i>
        </button>
      </header>

      <div class="sidebar-sections">
        <section class="sidebar-section" id="hotelBusinessSection">
          <button class="section-toggle" id="hotelBusinessToggle" type="button" aria-expanded="true">
            <span><i data-lucide="building-2"></i>酒店业务</span>
            <i data-lucide="chevron-down" class="section-chevron"></i>
          </button>
          <div class="section-content" id="hotelBusinessContent">
            <form class="sidebar-code-search" id="hotelLookupForm">
              <input id="hotelLookupInput" type="text" maxlength="100" placeholder="精确输入 MTHotelCode" autocomplete="off" aria-label="MTHotelCode">
              <button class="icon-button" type="submit" title="打开酒店" aria-label="打开酒店"><i data-lucide="arrow-right"></i></button>
            </form>
            <div class="list-heading">
              <span>最近变更</span>
              <span id="recentHotelCount">0 / 20</span>
            </div>
            <nav class="hotel-list" id="recentHotelList" aria-live="polite"></nav>
          </div>
        </section>

        <section class="sidebar-section other-section collapsed" id="otherConversationsSection">
          <button class="section-toggle" id="otherConversationsToggle" type="button" aria-expanded="false">
            <span><i data-lucide="messages-square"></i>其他会话</span>
            <i data-lucide="chevron-down" class="section-chevron"></i>
          </button>
          <div class="section-content" id="otherConversationsContent" hidden>
            <div class="sidebar-tools">
              <button class="primary-button" id="newConversationButton" type="button">
                <i data-lucide="square-pen"></i>
                <span>新建会话</span>
              </button>
              <label class="search-field">
                <i data-lucide="search" aria-hidden="true"></i>
                <input id="conversationSearch" type="search" placeholder="搜索会话、消息或 ID" autocomplete="off">
              </label>
            </div>
            <div class="list-heading">
              <span>普通会话</span>
              <span id="conversationCount">0</span>
            </div>
            <nav class="conversation-list" id="conversationList" aria-live="polite"></nav>
          </div>
        </section>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="workspace">
      <header class="workspace-header">
        <button class="icon-button mobile-only" id="openSidebarButton" type="button" title="打开会话列表" aria-label="打开会话列表">
          <i data-lucide="panel-left"></i>
        </button>
        <button class="icon-button" id="backToHotelBusinessButton" type="button" title="返回酒店搜索结果" aria-label="返回酒店搜索结果" hidden>
          <i data-lucide="arrow-left"></i>
        </button>
        <div class="workspace-title">
          <strong id="conversationTitle">酒店业务</strong>
          <button class="conversation-id" id="copyConversationIdButton" type="button" title="复制会话 ID" hidden>
            <span id="conversationId"></span>
            <i data-lucide="copy"></i>
          </button>
        </div>
        <div class="header-actions">
          <span class="service-status" id="serviceStatus"><span></span>检测中</span>
          <button class="icon-button danger-button" id="deleteConversationButton" type="button" title="删除会话" aria-label="删除会话" disabled>
            <i data-lucide="trash-2"></i>
          </button>
          <button class="icon-button mobile-only" id="openInspectorButton" type="button" title="打开运行检查器" aria-label="打开运行检查器">
            <i data-lucide="panel-right"></i>
          </button>
        </div>
      </header>

      <section class="messages" id="messages" aria-live="polite"></section>

      <section class="hotel-research-view" id="hotelResearchView" hidden>
        <div class="hotel-research-inner">
          <form class="hotel-search-form" id="hotelResearchForm">
            <label for="mtHotelCodeInput">MTHotelCode</label>
            <div class="hotel-search-input">
              <input id="mtHotelCodeInput" type="text" maxlength="100" placeholder="输入 MTHotelCode" autocomplete="off">
              <button id="hotelResearchButton" type="submit">
                <i data-lucide="search"></i>
                <span>搜索</span>
              </button>
            </div>
          </form>
          <div class="hotel-research-content" id="hotelResearchContent" aria-live="polite"></div>
        </div>
      </section>

      <form class="composer" id="composer">
        <div class="composer-options">
          <label class="select-control">
            <span>Agent</span>
            <select id="agentName">
              <option value="operations">operations</option>
            </select>
          </label>
          <label class="toggle-control">
            <input id="webSearchEnabled" type="checkbox" checked>
            <span class="toggle-track" aria-hidden="true"><span></span></span>
            <i data-lucide="globe-2" aria-hidden="true"></i>
            <span>Web Search</span>
          </label>
        </div>
        <div class="composer-input">
          <textarea id="messageInput" rows="1" maxlength="50000" placeholder="向 Agent 发送消息" aria-label="消息"></textarea>
          <button class="send-button" id="sendButton" type="submit" title="发送消息" aria-label="发送消息">
            <i data-lucide="arrow-up"></i>
          </button>
        </div>
        <div class="composer-footer">
          <span id="runStatus">准备就绪</span>
          <span><kbd>Ctrl</kbd> + <kbd>Enter</kbd></span>
        </div>
      </form>
    </main>

    <aside class="inspector" id="inspector" aria-label="运行检查器">
      <header class="inspector-header">
        <div>
          <strong>运行检查器</strong>
          <span id="inspectorSubtitle">未选择响应</span>
        </div>
        <button class="icon-button mobile-only" id="closeInspectorButton" type="button" title="关闭运行检查器" aria-label="关闭运行检查器">
          <i data-lucide="x"></i>
        </button>
      </header>
      <div class="tabs" role="tablist" aria-label="调试信息">
        <button class="tab active" type="button" role="tab" data-tab="sources" aria-selected="true">来源</button>
        <button class="tab" type="button" role="tab" data-tab="usage" aria-selected="false">用量</button>
        <button class="tab" type="button" role="tab" data-tab="raw" aria-selected="false">原始数据</button>
      </div>
      <div class="inspector-content">
        <section class="tab-panel active" id="sourcesPanel" data-panel="sources"></section>
        <section class="tab-panel" id="usagePanel" data-panel="usage"></section>
        <section class="tab-panel" id="rawPanel" data-panel="raw"></section>
      </div>
    </aside>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="app.js?v=20260827.7"></script>
</body>
</html>

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>配置中心与数据字典 · 模型图</title>
<style>
  :root {
    --side-w: 296px;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --line: #dfe3e8;
    --text: #1c2024;
    --muted: #5d6672;
    --accent: #1f6feb;
    --accent-soft: #e8f0fe;
  }
  html[data-theme="dark"] {
    --bg: #14171a;
    --panel: #1b1f24;
    --line: #2c3238;
    --text: #e7ebef;
    --muted: #9aa4b0;
    --accent: #6aa6ff;
    --accent-soft: #1d2a3d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  }
  .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); height: 100dvh; }

  .side {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border-right: 1px solid var(--line);
  }
  .side-head { padding: 18px 18px 14px; border-bottom: 1px solid var(--line); }
  .side-head h1 { margin: 0; font-size: 15px; font-weight: 650; letter-spacing: .2px; }
  .side-head p { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

  .menu { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px; }
  .menu button {
    display: block; width: 100%; padding: 10px 12px; margin-bottom: 4px;
    background: none; border: 1px solid transparent; border-radius: 8px;
    color: inherit; font: inherit; text-align: left; cursor: pointer;
  }
  .menu button:hover { background: var(--accent-soft); }
  .menu button[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent); }
  .menu .t { display: block; font-size: 13px; font-weight: 600; }
  .menu .d { display: block; margin-top: 2px; font-size: 11.5px; line-height: 1.5; color: var(--muted); }
  .menu button[aria-current="true"] .d { color: var(--text); opacity: .78; }

  .side-foot { padding: 12px 14px; border-top: 1px solid var(--line); }
  .side-foot p { margin: 8px 0 0; font-size: 11.5px; line-height: 1.55; color: var(--muted); }
  #theme {
    width: 100%; padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
    background: var(--bg); color: inherit; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  #theme:hover { border-color: var(--accent); color: var(--accent); }

  .main { min-width: 0; min-height: 0; background: var(--bg); }
  .main iframe { display: block; width: 100%; height: 100%; border: 0; background: var(--bg); }

  @media (max-width: 900px) {
    .shell { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
    .side { border-right: 0; border-bottom: 1px solid var(--line); }
    .menu { display: flex; gap: 6px; overflow-x: auto; overflow-y: hidden; padding: 8px; }
    .menu button { width: 210px; flex: 0 0 auto; margin-bottom: 0; }
    .side-foot { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <header class="side-head">
      <h1>配置中心与数据字典</h1>
      <p>模型图 · 7 张 · 左侧切换</p>
    </header>
    <nav class="menu" id="menu" aria-label="模型图列表"></nav>
    <footer class="side-foot">
      <button id="theme" type="button">切换深浅色</button>
      <p>每张图自带缩放、搜索、聚焦与 PNG / SVG 导出；本页只负责导航。</p>
    </footer>
  </aside>
  <main class="main">
    <iframe id="frame" title="模型图" src="about:blank"></iframe>
  </main>
</div>

<script>
  const FIGURES = [
    { id: '01-structure',  title: '① 整体结构',        desc: '写入路径与读取路径如何分离，只靠「发布」连通' },
    { id: '02-precedence', title: '② 优先级栈',        desc: 'IConfiguration 七层源，Override 压顶、Supplement 兜底' },
    { id: '03-datamodel',  title: '③ 数据模型',        desc: '六张表、继承解析顺序，以及刻意不建的外键' },
    { id: '04-usecase',    title: '④ 用例图',          desc: '四类参与者与各自动作，泳道即参与者' },
    { id: '05-startup',    title: '⑤ 时序 · 启动',     desc: '生产与本地开发两条分支，配置源何时就绪' },
    { id: '06-publish',    title: '⑥ 时序 · 发布',     desc: '编辑草稿 → 校验 → 发布 → 热生效' },
    { id: '07-rollback',   title: '⑦ 时序 · 回滚',     desc: '追加式回滚，且不回写草稿' },
  ];

  const menu = document.getElementById('menu');
  const frame = document.getElementById('frame');
  const root = document.documentElement;

  function readTheme() {
    try { return localStorage.getItem('archify-theme') === 'dark' ? 'dark' : 'light'; }
    catch { return 'light'; }
  }
  function writeTheme(value) {
    try { localStorage.setItem('archify-theme', value); } catch { /* 沙箱下忽略 */ }
    root.dataset.theme = value;
  }

  let current = null;

  function select(id) {
    const figure = FIGURES.find(x => x.id === id) || FIGURES[0];
    current = figure.id;
    // 先写主题再换 src，iframe 里的 viewer 启动时会读到同一个 archify-theme
    writeTheme(readTheme());
    frame.src = figure.id + '.html';
    for (const button of menu.querySelectorAll('button')) {
      button.setAttribute('aria-current', String(button.dataset.id === figure.id));
    }
    if (location.hash !== '#' + figure.id) {
      history.replaceState(null, '', '#' + figure.id);
    }
  }

  for (const figure of FIGURES) {
    const button = document.createElement('button');
    button.type = 'button';
    button.dataset.id = figure.id;
    button.innerHTML = '<span class="t"></span><span class="d"></span>';
    button.querySelector('.t').textContent = figure.title;
    button.querySelector('.d').textContent = figure.desc;
    button.addEventListener('click', () => select(figure.id));
    menu.appendChild(button);
  }

  document.getElementById('theme').addEventListener('click', () => {
    writeTheme(readTheme() === 'dark' ? 'light' : 'dark');
    if (current) { frame.src = current + '.html'; }
  });

  window.addEventListener('hashchange', () => select(location.hash.slice(1)));
  document.addEventListener('keydown', (event) => {
    if (event.key !== 'ArrowDown' && event.key !== 'ArrowUp') return;
    const index = FIGURES.findIndex(x => x.id === current);
    const next = event.key === 'ArrowDown'
      ? Math.min(FIGURES.length - 1, index + 1)
      : Math.max(0, index - 1);
    if (next !== index) select(FIGURES[next].id);
  });

  root.dataset.theme = readTheme();
  select(location.hash.slice(1));
</script>
</body>
</html>
